<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Favicon do palleira.com.br: a palheta dourada da comunidade.

    Cores literais de propósito — favicon não herda o CSS da página, então
    as variáveis do tema não valem aqui. Os valores são os mesmos das
    variáveis de ouro do globals.css.

    Sem os anéis finos da moeda: a 16px eles viram sujeira. O que precisa
    sobreviver nesse tamanho é a silhueta da palheta e o "P".
  -->
  <defs>
    <linearGradient id="g" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#f7dc7a"/>
      <stop offset="42%" stop-color="#e8b923"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="c" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#f7dc7a"/>
      <stop offset="60%" stop-color="#e8b923"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
  </defs>

  <path d="M12 1.6c5.1 0 8.7 2.7 8.7 6.3 0 2.9-1.7 6.1-3.9 8.9-1.6 2-3.4 3.8-4.8 5.1-1.4-1.3-3.2-3.1-4.8-5.1-2.2-2.8-3.9-6-3.9-8.9C3.3 4.3 6.9 1.6 12 1.6Z" fill="url(#g)"/>
  <path d="M12 1.6c5.1 0 8.7 2.7 8.7 6.3 0 .5-.1 1-.2 1.6-.6-3.2-4-5.5-8.5-5.5S4.1 6.3 3.5 9.5c-.1-.6-.2-1.1-.2-1.6C3.3 4.3 6.9 1.6 12 1.6Z" fill="#f7dc7a" opacity="0.55"/>
  <circle cx="12" cy="9.1" r="6.1" fill="url(#c)"/>
  <circle cx="12" cy="9.1" r="5.5" fill="none" stroke="#8b6914" stroke-width="0.45" opacity="0.5"/>
  <text x="12" y="12.3" text-anchor="middle" font-size="8" font-weight="700" fill="#8b6914" font-family="Georgia, 'Times New Roman', serif">P</text>
</svg>

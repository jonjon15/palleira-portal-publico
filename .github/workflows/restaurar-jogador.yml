# Restauração completa de um jogador que perdeu base + Pals: faz as três
# peças na ordem certa, com o servidor parado UMA vez só.
#
# A ordem importa. Subir o servidor entre um passo e outro acorda a rotina de
# limpeza do jogo, que apaga o que ainda está pela metade — foi assim que se
# perdeu 260 Pals do Tenshi em 05/09/2026.
#
#   1. Players/<uid>.sav  — os ponteiros das caixas de Pal. Sem ele, o resto
#      é jogado fora na subida seguinte.
#   2. Pals + caixas      — de um backup do Level.sav que ainda os tenha.
#   3. Base               — de um backup mais antigo, junto com a renovação do
#      contador de inatividade (senão o auto-reset de guild apaga em minutos).
#
# ⚠️ O modo `aplicar` reescreve o Level.sav de todo mundo. Comece por `simular`.
name: restaurar-jogador

on:
  workflow_dispatch:
    inputs:
      servidor:
        description: "Servidor"
        required: true
        type: choice
        options: [pve-vip, pve-free, pvp-free]
        default: pve-free
      uids:
        description: "UIDs dos jogadores (32 hex, separados por vírgula)"
        required: true
        type: string
      backup_pals:
        description: "Backup de onde tirar os Pals"
        required: false
        type: string
        default: Level.sav.bak-20260905-172655
      backup_base:
        description: "Backup de onde tirar a base"
        required: false
        type: string
        default: Level.sav.bak-20260822-154657
      modo:
        description: "simular | aplicar"
        required: true
        type: choice
        options: [simular, aplicar]
        default: simular
      pular_base:
        description: "Só devolver player.sav e Pals, sem mexer na base"
        required: false
        type: boolean
        default: false

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: |
          REPO=https://github.com/deafdudecomputers/PalworldSaveTools.git
          pip install --quiet paramiko
          pip install --quiet "git+$REPO#subdirectory=src/palsav/palooz"
          pip install --quiet "git+$REPO#subdirectory=src/palsav"

      - name: Parar o servidor
        if: inputs.modo == 'aplicar'
        env:
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: python tools/energia_painel.py --servidor "${{ inputs.servidor }}" --sinal stop --esperar offline

      - name: 1/3 — devolver Players/<uid>.sav
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: |
          python tools/restaurar_player_sav.py \
            --servidor "${{ inputs.servidor }}" \
            --uids "${{ inputs.uids }}" \
            --${{ inputs.modo }}

      - name: 2/3 — devolver Pals e caixas
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: |
          python tools/restaurar_pals.py \
            --servidor "${{ inputs.servidor }}" \
            --uids "${{ inputs.uids }}" \
            --arquivo-backup "${{ inputs.backup_pals }}" \
            --${{ inputs.modo }}

      - name: 3/3 — devolver a base
        if: ${{ !inputs.pular_base }}
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: |
          python tools/restaurar_base.py \
            --servidor "${{ inputs.servidor }}" \
            --uids "${{ inputs.uids }}" \
            --arquivo-backup "${{ inputs.backup_base }}" \
            --${{ inputs.modo }}

      - name: Religar o servidor
        if: always() && inputs.modo == 'aplicar'
        env:
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: python tools/energia_painel.py --servidor "${{ inputs.servidor }}" --sinal start --esperar running

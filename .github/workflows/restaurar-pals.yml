# Devolve os Pals de um jogador a partir de um backup. Ver tools/restaurar_pals.py.
#
# ⚠️ O modo `aplicar` REESCREVE O Level.sav DE TODO MUNDO. Comece por
# `verificar` e depois `simular`.
name: restaurar-pals

on:
  workflow_dispatch:
    inputs:
      servidor:
        description: "Servidor"
        required: true
        type: choice
        options: [pve-vip, pve-free, pvp-free]
        default: pve-free
      uids:
        description: "UIDs dos jogadores (32 hex, separados por vírgula)"
        required: false
        type: string
      arquivo_backup:
        description: "Backup de onde tirar os Pals"
        required: false
        type: string
        default: Level.sav.bak-20260905-172655
      modo:
        description: "verificar | simular | aplicar"
        required: true
        type: choice
        options: [verificar, simular, aplicar]
        default: simular
      parar_servidor:
        description: "Parar o servidor antes de gravar (obrigatório em 'aplicar')"
        required: false
        type: boolean
        default: true

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: |
          REPO=https://github.com/deafdudecomputers/PalworldSaveTools.git
          pip install --quiet paramiko
          pip install --quiet "git+$REPO#subdirectory=src/palsav/palooz"
          pip install --quiet "git+$REPO#subdirectory=src/palsav"

      - name: Parar o servidor
        if: inputs.modo == 'aplicar' && inputs.parar_servidor
        env:
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: python tools/energia_painel.py --servidor "${{ inputs.servidor }}" --sinal stop --esperar offline

      - name: Restaurar Pals
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: |
          python tools/restaurar_pals.py \
            --servidor "${{ inputs.servidor }}" \
            --uids "${{ inputs.uids }}" \
            --arquivo-backup "${{ inputs.arquivo_backup }}" \
            --${{ inputs.modo }}

      - name: Religar o servidor
        if: always() && inputs.modo == 'aplicar' && inputs.parar_servidor
        env:
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: python tools/energia_painel.py --servidor "${{ inputs.servidor }}" --sinal start --esperar running

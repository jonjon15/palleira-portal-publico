name: Import do save

# Roda aqui e não na Vercel: o save é comprimido com Oodle e, ao parsear,
# vira centenas de MB. Não cabe em função serverless, e o parser é Python.
on:
  schedule:
    # De 2 em 2 horas. Baixar e processar os três saves leva menos de 1 min,
    # e são só 26 MB — o servidor nem sente. O limite real é o minuto de CI
    # do GitHub (2.000/mês no plano grátis): 12 execuções por dia consomem
    # ~720, com folga. Aumentar a frequência daqui exige olhar essa conta.
    - cron: "0 */2 * * *"
  workflow_dispatch: # permite rodar na mão pelo painel do GitHub

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Descompressor Kraken open source. Precisa dele porque o Palworld passou
      # a usar Oodle (container PlM) na v0.6, e a lib Python só lê o formato
      # antigo (PlZ/zlib).
      #
      # ⚠️ O powzix/ooz original é só Windows (depende do SDK da Microsoft).
      # O oozlin é a porta para Linux — é ele que compila no runner.
      # `palworld-save-tools` do PyPI parou na 0.24 e não lê o formato atual:
      # o Palworld passou a comprimir com Oodle (container PlM) na v0.6 e
      # mudou tipos que a lib não conhece. O `palsav-flex` é a fork que
      # acompanha o jogo — traz o Oodle junto, no pacote `palooz`.
      - name: Dependências Python
        run: |
          REPO=https://github.com/deafdudecomputers/PalworldSaveTools.git
          pip install --quiet paramiko "psycopg[binary]"
          pip install --quiet "git+$REPO#subdirectory=src/palsav/palooz"
          pip install --quiet "git+$REPO#subdirectory=src/palsav"
          python -c "import palsav, palooz; print('palsav e palooz prontos')"

      - name: Importar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
        run: python tools/import_save.py

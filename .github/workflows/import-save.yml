name: Import do save

# Roda aqui e não na Vercel: o save é comprimido com Oodle e, ao parsear,
# vira centenas de MB. Não cabe em função serverless, e o parser é Python.
on:
  schedule:
    # 06:00 UTC = 03:00 de Brasília, servidor vazio
    - cron: "0 6 * * *"
  workflow_dispatch: # permite rodar na mão pelo painel do GitHub

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Descompressor Kraken open source. Precisa dele porque o Palworld passou
      # a usar Oodle (container PlM) na v0.6, e a lib Python só lê o formato
      # antigo (PlZ/zlib).
      #
      # ⚠️ O powzix/ooz original é só Windows (depende do SDK da Microsoft).
      # O oozlin é a porta para Linux — é ele que compila no runner.
      #
      # ⚠️ Não usar o executável `oozlin` pronto: o main.cpp dele carrega
      # `libs/liblinoodle.so`, que é wrapper da DLL PROPRIETÁRIA do Oodle e
      # falha na hora sem ela. O descompressor limpo (kraken.cpp e cia) não
      # precisa de DLL nenhuma — então compilamos só ele, com um shim em C.
      - name: Compilar o descompressor Kraken
        run: |
          git clone --depth 1 https://github.com/synnfynn/oozlin.git /tmp/oozlin
          cd /tmp/oozlin
          cat > shim.cpp <<'CPP'
          #include "stdafx.h"
          #include "kraken.h"
          extern "C" int ooz_decompress(const byte *src, size_t src_len,
                                        byte *dst, size_t dst_len) {
            return Kraken_Decompress(src, src_len, dst, dst_len);
          }
          CPP
          g++ -O2 -fPIC -shared -std=c++17 -o /tmp/libooz.so \
            shim.cpp bitknit.cpp huff.cpp kraken.cpp kraken_bits.cpp \
            mermaid.cpp leviathan.cpp lzna.cpp stdafx.cpp utilities.cpp
          ls -la /tmp/libooz.so
          echo "OOZ_LIB=/tmp/libooz.so" >> "$GITHUB_ENV"

      - name: Dependências Python
        run: pip install --quiet paramiko "psycopg[binary]" palworld-save-tools

      - name: Importar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
        run: python tools/import_save.py

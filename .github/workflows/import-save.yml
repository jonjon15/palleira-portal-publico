name: Import do save

# Roda aqui e não na Vercel: o save é comprimido com Oodle e, ao parsear,
# vira centenas de MB. Não cabe em função serverless, e o parser é Python.
on:
  schedule:
    # 06:00 UTC = 03:00 de Brasília, servidor vazio
    - cron: "0 6 * * *"
  workflow_dispatch: # permite rodar na mão pelo painel do GitHub

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Descompressor Kraken open source. Precisa dele porque o Palworld passou
      # a usar Oodle (container PlM) na v0.6, e a lib Python só lê o formato
      # antigo (PlZ/zlib).
      #
      # ⚠️ O powzix/ooz original é só Windows (depende do SDK da Microsoft).
      # O oozlin é a porta para Linux — é ele que compila no runner.
      - name: Compilar o oozlin
        run: |
          git clone --depth 1 https://github.com/synnfynn/oozlin.git /tmp/oozlin
          cd /tmp/oozlin
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2 2>&1 | tail -8
          BIN=$(find /tmp/oozlin/build -maxdepth 2 -type f -perm -u+x \
                 ! -name "*.sh" ! -name "*.o" ! -name "*.cmake" | head -1)
          echo "binario: $BIN"
          test -n "$BIN" || { echo "compilacao nao gerou binario"; exit 1; }
          echo "OOZ_BIN=$BIN" >> "$GITHUB_ENV"
          echo "--- modo de uso ---"
          "$BIN" 2>&1 | head -20 || true

      - name: Dependências Python
        run: pip install --quiet paramiko "psycopg[binary]" palworld-save-tools

      - name: Importar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
        run: python tools/import_save.py

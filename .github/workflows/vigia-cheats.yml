# Kicka quem o PalDefender flagra por dano em rajada.
#
# O anticheat detecta mas não pune essa heurística ("requires human
# judgement") — confirmado na própria DLL: existe `doActionUponIllegalPalStats`
# e `doActionUponDoctorSurgiExploit`, mas nada equivalente para dano. Por isso
# a punição precisa vir de fora. Ver tools/vigia_cheats.py.
name: vigia de cheats

# 🔴 SEM `schedule` de propósito — só roda na mão.
#
# Rodando sozinho ele kickou gente que JÁ TINHA PARADO (12/09/2026): o
# xNEGANx desligou o Cheat Engine, e mesmo assim levou kick por "30 detecções
# em 5 minutos" que eram do histórico de antes. A causa é a natureza deste
# script: ele lê o ARQUIVO DE LOG INTEIRO e conta tudo que está lá, sem saber
# o que é de agora e o que é de uma hora atrás. O Kaninos, que nem estava no
# servidor, também foi "kickado" por 43 detecções antigas.
#
# Quem faz esse trabalho agora é `app/api/anticheat/route.ts`, alimentado pelo
# `webhookURL_AntiCheats` do PalDefender: lá cada aviso chega no instante em
# que acontece, então a janela de 5 minutos é de verdade. Este script fica
# como ferramenta de AUDITORIA — "quem apareceu no log de hoje" —, e para isso
# o normal é rodar sem `--aplicar`.
on:
  workflow_dispatch:
    inputs:
      servidor:
        description: "Servidor"
        required: true
        type: choice
        options: [pvp-free, pve-free, pve-vip]
        default: pvp-free
      limiar:
        description: "Detecções em 5 min para kickar"
        required: false
        type: string
        default: "30"
      vigiar:
        description: "Minutos vigiando (vazio = uma checagem só)"
        required: false
        type: string
        default: ""
      aplicar:
        description: "Kickar de verdade (o padrão é SÓ RELATAR — ver aviso no topo)"
        required: false
        type: boolean
        default: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    # Um pouco acima do --vigiar, para o job não ser morto no meio.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet paramiko

      # O estado de "quem já kickei" vive no cache: o runner é descartável,
      # e sem isso cada execução kickaria de novo quem já saiu (o log não
      # some quando a pessoa desconecta).
      - uses: actions/cache@v4
        with:
          path: tools/.vigia_cheats.json
          key: vigia-cheats-${{ github.run_id }}
          restore-keys: vigia-cheats-

      - name: Vigiar
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          SRV1_ADMIN_PASSWORD: ${{ secrets.SRV1_ADMIN_PASSWORD }}
          SRV2_ADMIN_PASSWORD: ${{ secrets.SRV2_ADMIN_PASSWORD }}
          SRV3_ADMIN_PASSWORD: ${{ secrets.SRV3_ADMIN_PASSWORD }}
        run: |
          python tools/vigia_cheats.py \
            --servidor "${{ inputs.servidor || 'pvp-free' }}" \
            --limiar "${{ inputs.limiar || '30' }}" \
            ${{ inputs.vigiar && format('--vigiar {0} --intervalo 30', inputs.vigiar) || '' }} \
            ${{ inputs.aplicar && '--aplicar' || '' }}

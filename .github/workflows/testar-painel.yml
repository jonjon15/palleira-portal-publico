# A API do painel responde de IP de datacenter? Do PC do dono funciona, do
# runner deu 403. Se for so User-Agent, passa com cabecalho de navegador.
# Isso decide se o site (Vercel, tambem datacenter) consegue ligar/reiniciar.
name: testar-painel

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a API do painel de varias formas
        env:
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          key = os.environ["ENX_API_KEY"]
          NAV = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                 "(KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36")

          def tentar(nome, ua):
              h = {"Authorization": f"Bearer {key}", "Accept": "application/json"}
              if ua: h["User-Agent"] = ua
              r = urllib.request.Request(
                  "https://painel.enxadahost.com/api/client/servers/0c079595/resources",
                  headers=h)
              try:
                  with urllib.request.urlopen(r, timeout=30) as resp:
                      print(f"  {nome:22} -> HTTP {resp.status}  OK")
                      return True
              except urllib.error.HTTPError as e:
                  corpo = e.read()[:120].decode("utf-8","replace").replace("\n"," ")
                  print(f"  {nome:22} -> HTTP {e.code}  {corpo}")
              except Exception as e:
                  print(f"  {nome:22} -> {type(e).__name__}: {e}")
              return False

          print("De um IP de datacenter (GitHub Actions):")
          a = tentar("User-Agent padrao", None)
          b = tentar("User-Agent navegador", NAV)
          print()
          if b:
              print("=> PASSA com UA de navegador. A Vercel tambem deve passar,")
              print("   e os botoes de energia do site funcionam em producao.")
          elif a:
              print("=> Passa com UA padrao. O 403 anterior era outra coisa.")
          else:
              print("=> BLOQUEADO de datacenter, independente de User-Agent.")
              print("   Consequencia: os botoes de energia do site NAO vao")
              print("   funcionar na Vercel. Parar/religar tem que sair por RCON")
              print("   ou pelo proprio runner via outro caminho.")
          PY

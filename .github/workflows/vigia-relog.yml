# Avisa e suspende quem fica saindo e entrando para resetar spawn.
#
# O jogador descobriu que sair e voltar recria o spawn da área: quando o último
# jogador deixa a região, o Palworld descarrega aquele pedaço do mundo e na
# volta os Pals nascem de novo. Não há opção no jogo nem no PalDefender que
# desligue isso — é do motor. O que dá é tirar o proveito. Ver
# tools/vigia_relog.py.
name: vigia de relog

# 🔴 Ao contrário do vigia de cheats, este TEM `schedule`, de propósito.
#
# O vigia de cheats ficou manual porque lia o LOG INTEIRO sem distinguir
# "agora" de "uma hora atrás" (kickou o xNEGANx por detecções de quando ele já
# tinha parado — 12/09/2026). Este script não tem esse defeito desde
# cca1030 (14/09/2026): toda leitura já descarta o que é mais velho que
# `JANELA_SEGUNDOS`, medido contra o carimbo mais recente do próprio log, não
# do relógio do runner. Uma execução curta a cada 5 minutos é tão correta
# quanto o modo `--vigiar` contínuo — só troca "um processo vigiando sem
# parar" por "várias fotos de 10 min em sequência", e a janela de checagem
# (10 min) é maior que o intervalo entre fotos (5 min), então não sobra buraco.
#
# O estado (avisos, degrau da escada, quem está suspenso) sobrevive entre
# execuções por `actions/cache/restore` + `.../save` (não o `cache@v4`
# completo: uma chave de cache é imutável, então uma chave fixa nunca se
# atualizaria de uma rodada para a outra). Cada rodada grava sob uma chave com
# o `run_id` e a próxima acha essa "foto" pelo prefixo em `restore-keys` — ver
# o comentário junto do passo. Cache do GitHub não é banco: pode ser
# despejado, e duas execuções do mesmo servidor ao mesmo tempo pisariam uma na
# outra — por isso o `concurrency` abaixo enfileira em vez de rodar em
# paralelo, e o `cancel-in-progress: false` garante que uma rodada não é
# abortada no meio de uma suspensão.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      servidor:
        description: "Servidor"
        required: true
        type: choice
        options: [pvp-free, pve-free, pve-vip]
        default: pvp-free
      limiar:
        description: "Quedas na janela para disparar o aviso"
        required: false
        type: string
        default: "5"
      vigiar:
        description: "Minutos vigiando (vazio = uma checagem só)"
        required: false
        type: string
        default: ""
      aplicar:
        description: "Avisar e suspender de verdade"
        required: false
        type: boolean
        default: true

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    # actions:write é o que a API de cache (gh cache list/delete) exige — sem
    # isso o passo de limpeza toma 403 "Resource not accessible by
    # integration" e nunca apaga o cache velho (visto na prática em 16/09).
    permissions:
      actions: write
      contents: read
    strategy:
      # Um servidor de cada vez não bloqueia os outros: se o pve-vip travar,
      # o pvp-free (onde o abuso foi visto) continua sendo checado. No cron
      # roda sempre os três; no disparo manual, só o escolhido em `servidor`.
      fail-fast: false
      matrix:
        servidor: >-
          ${{ github.event_name == 'schedule'
              && fromJSON('["pvp-free", "pve-free", "pve-vip"]')
              || fromJSON(format('["{0}"]', inputs.servidor)) }}

    # Duas execuções do MESMO servidor ao mesmo tempo escreveriam a whitelist
    # uma por cima da outra e contariam avisos em dobro. Cron de 5 em 5 min
    # não deveria sobrepor um job de ~4 min, mas um disparo manual no meio
    # pode — daí o enfileiramento em vez de cancelar.
    concurrency:
      group: vigia-relog-${{ matrix.servidor }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet paramiko

      - uses: actions/cache/restore@v4
        with:
          path: tools/.vigia_relog.json
          key: vigia-relog-${{ matrix.servidor }}-${{ github.run_id }}
          restore-keys: vigia-relog-${{ matrix.servidor }}-

      - name: Checar
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          SRV1_ADMIN_PASSWORD: ${{ secrets.SRV1_ADMIN_PASSWORD }}
          SRV2_ADMIN_PASSWORD: ${{ secrets.SRV2_ADMIN_PASSWORD }}
          SRV3_ADMIN_PASSWORD: ${{ secrets.SRV3_ADMIN_PASSWORD }}
        run: |
          python tools/vigia_relog.py \
            --servidor "${{ matrix.servidor }}" \
            --limiar "${{ inputs.limiar || '5' }}" \
            ${{ inputs.vigiar && format('--vigiar {0} --intervalo 60', inputs.vigiar) || '' }} \
            ${{ (inputs.aplicar == '' || inputs.aplicar) && '--aplicar' || '' }}

      # Se o job cair no meio de uma suspensão, alguém fica fora da whitelist
      # sem ninguém para repor. Este passo devolve todo mundo que ainda estava
      # cumprindo castigo, mesmo quando o passo anterior falha ou é cancelado.
      - name: Repor quem ficou suspenso
        if: always()
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          SRV1_ADMIN_PASSWORD: ${{ secrets.SRV1_ADMIN_PASSWORD }}
          SRV2_ADMIN_PASSWORD: ${{ secrets.SRV2_ADMIN_PASSWORD }}
          SRV3_ADMIN_PASSWORD: ${{ secrets.SRV3_ADMIN_PASSWORD }}
        run: |
          python tools/vigia_relog.py \
            --servidor "${{ matrix.servidor }}" \
            --repor-todos \
            ${{ (inputs.aplicar == '' || inputs.aplicar) && '--aplicar' || '' }}

      # Grava sempre, mesmo se "Checar" ou "Repor" falharem (`if: always()`),
      # para não perder avisos/suspensões já aplicados por causa de um erro
      # de rede no passo seguinte. A chave leva o run_id, então esta execução
      # nunca colide com o cache que ela mesma restaurou — vira a "foto mais
      # recente" que a próxima rodada vai achar pelo `restore-keys`.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tools/.vigia_relog.json
          key: vigia-relog-${{ matrix.servidor }}-${{ github.run_id }}

      # A cada 5 min, 24/7, isto criaria uma entrada de cache nova PARA
      # SEMPRE (288/dia só deste servidor) se nada apagasse as velhas — até
      # despejar cache de outros workflows do repo. Apaga tudo que casa com o
      # prefixo deste servidor, exceto a que acabou de ser salva.
      - name: Limpar cache velho deste servidor
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "${{ github.repository }}" \
            --key "vigia-relog-${{ matrix.servidor }}-" \
            --limit 100 \
            --json id,key \
            --jq ".[] | select(.key != \"vigia-relog-${{ matrix.servidor }}-${{ github.run_id }}\") | .id" |
          while read -r id; do
            gh cache delete "$id" --repo "${{ github.repository }}" || true
          done

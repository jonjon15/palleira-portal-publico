name: Backfill de bases (22/08, pve-free)

# Preenchimento único do passado: insere em base_snapshots as bases do
# pve-free que só existem no backup avulso Level.sav.bak-20260822-154657 (de
# antes do decay) — para quem hoje não tem nenhuma versão arquivada. Ver
# tools/backfill_bases_2208.py.
#
# Não toca no servidor nem no Level.sav vivo. Só lê o backup e grava em
# base_snapshots, no Neon.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "simular | aplicar"
        required: true
        type: choice
        options: [simular, aplicar]
        default: simular

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: |
          REPO=https://github.com/deafdudecomputers/PalworldSaveTools.git
          pip install --quiet paramiko "psycopg[binary]"
          pip install --quiet "git+$REPO#subdirectory=src/palsav/palooz"
          pip install --quiet "git+$REPO#subdirectory=src/palsav"

      - name: Backfill
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tools/backfill_bases_2208.py --${{ inputs.modo }}

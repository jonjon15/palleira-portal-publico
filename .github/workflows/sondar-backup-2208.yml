name: Sondar backup de 22/08 (pve-free)

# Investigação sob demanda, só leitura: lista as bases/guilds do backup avulso
# Level.sav.bak-20260822-154657 (de antes do decay) e compara com o que já
# está em base_snapshots hoje — para achar quem só tem chance de voltar por
# esse backup. Ver tools/sondar_backup_2208.py.
on:
  workflow_dispatch: {}

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: |
          REPO=https://github.com/deafdudecomputers/PalworldSaveTools.git
          pip install --quiet paramiko "psycopg[binary]"
          pip install --quiet "git+$REPO#subdirectory=src/palsav/palooz"
          pip install --quiet "git+$REPO#subdirectory=src/palsav"

      - name: Sondar
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python tools/sondar_backup_2208.py

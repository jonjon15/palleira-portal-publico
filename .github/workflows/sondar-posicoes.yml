# Mede onde estão as bases e as peças construídas, para saber se dá para
# devolver uma base em outro lugar do mapa. Ver tools/sondar_posicoes.py.
# Só leitura.
name: sondar-posicoes

on:
  workflow_dispatch:
    inputs:
      servidor:
        description: "Servidor"
        required: true
        type: choice
        options: [pve-vip, pve-free, pvp-free]
        default: pve-free
      uids:
        description: "UIDs a detalhar (32 hex, separados por vírgula)"
        required: false
        type: string
        default: ""
      todas:
        description: "Listar todas as bases do mundo com coordenada de mapa"
        required: false
        type: boolean
        default: true
      dump:
        description: "Esboço cru da primeira base e da primeira peça"
        required: false
        type: boolean
        default: false

jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: |
          REPO=https://github.com/deafdudecomputers/PalworldSaveTools.git
          pip install --quiet paramiko
          pip install --quiet "git+$REPO#subdirectory=src/palsav/palooz"
          pip install --quiet "git+$REPO#subdirectory=src/palsav"

      - name: Sondar posições
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
        run: |
          python tools/sondar_posicoes.py \
            --servidor "${{ inputs.servidor }}" \
            --uids "${{ inputs.uids }}" \
            ${{ inputs.todas && '--todas' || '' }} \
            ${{ inputs.dump && '--dump' || '' }}

# Devolve o CONTEÚDO da bag de um jogador: mochila, essenciais, armas,
# armadura e comida. Ver tools/restaurar_itens.py.
#
# Serve para consertar quem já perdeu. Para quem for restaurado daqui em
# diante, o mesmo passo já roda dentro de `restaurar-jogador.yml`.
#
# ⚠️ O modo `aplicar` para o servidor, reescreve o Level.sav e religa.
name: restaurar-itens

on:
  workflow_dispatch:
    inputs:
      servidor:
        description: "Servidor"
        required: true
        type: choice
        options: [pve-vip, pve-free, pvp-free]
        default: pve-free
      uids:
        description: "UIDs dos jogadores (32 hex, separados por vírgula)"
        required: true
        type: string
      backup:
        description: "Pasta de backup/world a usar (auto = a mais nova que ainda tenha a bag)"
        required: false
        type: string
        default: auto
      modo:
        description: "simular | aplicar"
        required: true
        type: choice
        options: [simular, aplicar]
        default: simular

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: |
          REPO=https://github.com/deafdudecomputers/PalworldSaveTools.git
          pip install --quiet paramiko
          pip install --quiet "git+$REPO#subdirectory=src/palsav/palooz"
          pip install --quiet "git+$REPO#subdirectory=src/palsav"

      - name: Parar o servidor
        if: inputs.modo == 'aplicar'
        env:
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: python tools/energia_painel.py --servidor "${{ inputs.servidor }}" --sinal stop --esperar offline

      - name: Devolver a bag
        env:
          PALLEIRA_SERVERS: ${{ secrets.PALLEIRA_SERVERS }}
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: |
          python tools/restaurar_itens.py \
            --servidor "${{ inputs.servidor }}" \
            --uids "${{ inputs.uids }}" \
            --arquivo-backup "${{ inputs.backup }}" \
            --${{ inputs.modo }}

      - name: Religar o servidor
        if: always() && inputs.modo == 'aplicar'
        env:
          ENX_API_KEY: ${{ secrets.ENX_API_KEY }}
        run: python tools/energia_painel.py --servidor "${{ inputs.servidor }}" --sinal start --esperar running
